<!-- Warm paper, terracotta mark, one ledger rule: the same three ingredients the
     page is made of. Square-cornered, matching the system's default shape.
     The initials are set large enough to survive a 16px browser tab — at that
     size the rule and the inset border read as texture, not detail, so the
     mark has to carry it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#F6F1E8" />
  <rect x="1" y="1" width="62" height="62" fill="none" stroke="#B0442A" stroke-opacity="0.4" stroke-width="2" />
  <text x="32" y="29" fill="#B0442A"
    font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34"
    font-weight="600" letter-spacing="-1.5" text-anchor="middle" dominant-baseline="central">HS</text>
  <rect x="14" y="49" width="36" height="3" fill="#B0442A" fill-opacity="0.5" />
</svg>
