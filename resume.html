<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Hank Sha's résumé — pick the version matched to the role, view it in the browser or download the PDF.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#F6F1E8">
    <link rel="canonical" href="https://www.hanksha.com/resume">
    <title>Résumé | Hank Sha</title>

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Fonts are self-hosted via @fontsource and bundled with the stylesheet -->
</head>

<body>

    <a class="skip-link" href="#variants">Skip to content</a>

    <!--
      The picker's rows are static markup, not rendered from
      src/resume-variants.ts. The résumé is the document a recruiter came for;
      it should not need JavaScript to be reachable. Keep this list and the
      manifest in step — the manifest's header says how.
    -->
    <nav class="nav utility-nav" aria-label="Main navigation">
        <div class="nav-inner">
            <a class="nav-mark" href="/">Hank Sha</a>
            <ul class="nav-list">
                <li><a href="/" class="nav-link">Portfolio</a></li>
                <li><a href="/#contact" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="utility-main">
        <div class="utility-inner">
            <div class="sec-head utility-head">
                <h1>Résumé</h1>
                <p class="sec-note">Same facts in every version — the ordering changes to match the role.</p>
            </div>

            <div class="ledger" id="variants">

                <article class="row">
                    <div class="row-idx">01</div>
                    <div class="row-main">
                        <h2 class="row-title"><a href="/resume/applied-ai">Applied AI</a></h2>
                        <p class="row-desc">For applied AI and ML engineering roles.</p>
                    </div>
                    <div class="row-meta">
                        <span class="row-links"><a href="/assets/hank_sha_resume.pdf"
                                download="hank-sha-applied-ai.pdf">Download&nbsp;PDF</a></span>
                    </div>
                    <div class="row-arrow" aria-hidden="true">→</div>
                </article>

                <!-- Waiting on public/assets/resume-fde.pdf. Uncomment with the
                     manifest flag; see src/resume-variants.ts.
                <article class="row">
                    <div class="row-idx">02</div>
                    <div class="row-main">
                        <h2 class="row-title"><a href="/resume/fde">Forward-Deployed Engineering</a></h2>
                        <p class="row-desc">For forward-deployed and solutions engineering roles.</p>
                    </div>
                    <div class="row-meta">
                        <span class="row-links"><a href="/assets/resume-fde.pdf"
                                download="hank-sha-fde.pdf">Download&nbsp;PDF</a></span>
                    </div>
                    <div class="row-arrow" aria-hidden="true">→</div>
                </article>
                -->

                <!-- Waiting on public/assets/resume-data-science.pdf.
                <article class="row">
                    <div class="row-idx">03</div>
                    <div class="row-main">
                        <h2 class="row-title"><a href="/resume/data-science">Data Science</a></h2>
                        <p class="row-desc">For data science and applied statistics roles.</p>
                    </div>
                    <div class="row-meta">
                        <span class="row-links"><a href="/assets/resume-data-science.pdf"
                                download="hank-sha-data-science.pdf">Download&nbsp;PDF</a></span>
                    </div>
                    <div class="row-arrow" aria-hidden="true">→</div>
                </article>
                -->

            </div>

            <p class="utility-note">Looking for a different emphasis? <a href="/#contact">Get in touch</a> and say which
                role you have in mind.</p>
        </div>
    </main>

    <script type="module" src="/src/resume-picker.ts"></script>
</body>

</html>
