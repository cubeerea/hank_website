<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Global PID Steering: Simpler Control, Better Capability Preservation in LLM Jailbreak Defense — a paper by Hank Sha, UC Santa Barbara.">
    <meta name="theme-color" content="#F6F1E8">
    <link rel="canonical" href="https://www.hanksha.com/pid-steering">
    <title>Global PID Steering | Hank Sha</title>

    <meta property="og:type" content="article">
    <meta property="og:title" content="Global PID Steering — Hank Sha">
    <meta property="og:description"
        content="A single averaged refusal vector, applied over a verified persistence window, preserves capability far better than full-depth per-layer PID steering.">
    <meta property="og:url" content="https://www.hanksha.com/pid-steering">

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Fonts are self-hosted via @fontsource and bundled with the stylesheet -->
</head>

<!--
  The paper viewer. Shares the .viewer chrome with the three résumé viewers —
  same bar, same buttons, same states — and differs only in being paginated:
  a .viewer-pages list of .pdf-page boxes rather than one canvas, plus the
  page counter that implies.

  This page used to be built from raw Tailwind utilities: rounded-lg corners
  off the radius ramp, backdrop-blur on a fixed header, bg-ink/5 button fills,
  a 56px rounded-full floating download button, and a 12/14/16/18px type ramp
  with nothing in it from the system. It carried the palette and none of the
  identity — and it is the first click out of the Projects grid, so it was the
  one page that undid the ledger the moment a visitor left the homepage.
-->

<body class="viewer-page">

    <div class="viewer">

        <header class="viewer-bar">
            <div class="viewer-id">
                <a class="nav-mark" href="/">Hank Sha</a>
                <a class="nav-link" href="/#projects">Projects</a>
                <h1 class="viewer-variant"><span class="sr-only">Paper — </span>Global PID Steering</h1>
                <p class="viewer-meta">UC Santa Barbara · June 2026</p>
            </div>

            <div class="viewer-tools">
                <span id="pageCounter" class="viewer-count" role="status"></span>
                <button id="zoomOutBtn" class="viewer-btn" type="button" aria-label="Zoom out">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
                        <path d="M20 12H4" />
                    </svg>
                </button>
                <span id="zoomLevel" class="viewer-zoom" role="status">100%</span>
                <button id="zoomInBtn" class="viewer-btn" type="button" aria-label="Zoom in">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
                        <path d="M12 4v16m8-8H4" />
                    </svg>
                </button>
                <a class="viewer-download" href="/assets/global-pid-steering.pdf" download="global-pid-steering.pdf">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <path d="M7 10l5 5 5-5" />
                        <path d="M12 15V3" />
                    </svg>
                    <span>Download PDF</span>
                </a>
            </div>
        </header>

        <main id="viewport" class="viewer-stage">
            <div class="viewer-stage-inner">

                <div id="loadingState" class="viewer-state is-shown">
                    <div class="viewer-spinner"></div>
                    <p>Loading the paper…</p>
                </div>

                <div id="errorState" class="viewer-state">
                    <h2>This paper didn't load</h2>
                    <p>The in-browser viewer needs the PDF to load over the network. Download it instead — the
                        file itself is fine.</p>
                    <a class="viewer-download" href="/assets/global-pid-steering.pdf"
                        download="global-pid-steering.pdf">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <path d="M7 10l5 5 5-5" />
                            <path d="M12 15V3" />
                        </svg>
                        <span>Download PDF</span>
                    </a>
                </div>

                <!-- One .pdf-page per page, appended by src/pid-steering.ts. -->
                <div id="pageList" class="viewer-pages"></div>

            </div>
        </main>

    </div>

    <script type="module" src="/src/pid-steering.ts"></script>
</body>

</html>
