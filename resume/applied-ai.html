<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hank Sha's résumé — Applied AI version.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#F6F1E8">
    <link rel="canonical" href="https://www.hanksha.com/resume/applied-ai">
    <title>Résumé · Applied AI | Hank Sha</title>

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Fonts are self-hosted via @fontsource and bundled with the stylesheet -->
</head>

<!--
  One viewer page per résumé variant. They differ only in the three values
  below (slug, label, file) — src/resume.ts reads the PDF path off
  data-pdf so the page stays the single place a variant's file is named in
  markup, and src/resume-variants.ts stays the place it is named in code.
-->

<body class="viewer-page" data-pdf="/assets/hank_sha_resume.pdf">

    <div class="viewer">

        <header class="viewer-bar">
            <div class="viewer-id">
                <a class="nav-mark" href="/">Hank Sha</a>
                <a class="nav-link" href="/resume">Résumé</a>
                <h1 class="viewer-variant"><span class="sr-only">Résumé — </span>Applied AI</h1>
            </div>

            <div class="viewer-tools">
                <button id="zoomOutBtn" class="viewer-btn" type="button" aria-label="Zoom out">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
                        <path d="M20 12H4" />
                    </svg>
                </button>
                <span id="zoomLevel" class="viewer-zoom" role="status">100%</span>
                <button id="zoomInBtn" class="viewer-btn" type="button" aria-label="Zoom in">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
                        <path d="M12 4v16m8-8H4" />
                    </svg>
                </button>
                <a class="viewer-download" href="/assets/hank_sha_resume.pdf" download="hank-sha-applied-ai.pdf">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <path d="M7 10l5 5 5-5" />
                        <path d="M12 15V3" />
                    </svg>
                    <span>Download PDF</span>
                </a>
            </div>
        </header>

        <main class="viewer-stage">
            <div class="viewer-stage-inner">

                <div id="loadingState" class="viewer-state is-shown">
                    <div class="viewer-spinner"></div>
                    <p>Loading résumé…</p>
                </div>

                <div id="errorState" class="viewer-state">
                    <h2>This résumé didn't load</h2>
                    <p>The in-browser viewer needs the PDF to load over the network. Download it instead — the
                        file itself is fine.</p>
                    <a class="viewer-download" href="/assets/hank_sha_resume.pdf" download="hank-sha-applied-ai.pdf">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <path d="M7 10l5 5 5-5" />
                            <path d="M12 15V3" />
                        </svg>
                        <span>Download PDF</span>
                    </a>
                </div>

                <div id="canvasContainer">
                    <canvas id="pdfCanvas"></canvas>
                </div>

            </div>
        </main>

    </div>

    <script type="module" src="/src/resume.ts"></script>
</body>

</html>
