<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>favicon render rig</title>
    <!--
      Rig for scripts/favicons.sh. Renders the same artwork as
      public/favicon.svg at each raster size with the real IBM Plex Mono
      loaded, so the PNG fallbacks match the SVG instead of falling back to
      whatever mono face the rasterizer happens to find.

      The SVG is inlined rather than loaded through <img>: an SVG inside an
      <img> is its own isolated document and cannot see this page's webfont.

      Keep the artwork here in sync with public/favicon.svg.
      Not shipped — scripts/ is outside the Vite build's page entries.
    -->
    <link rel="stylesheet" href="/node_modules/@fontsource/ibm-plex-mono/latin-600.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: #fff;
        }

        svg {
            display: block;
        }

        #s32 {
            width: 32px;
            height: 32px;
        }

        #s180 {
            width: 180px;
            height: 180px;
        }

        #s192 {
            width: 192px;
            height: 192px;
        }
    </style>
</head>

<body>
    <template id="art">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" fill="#F6F1E8" />
            <rect x="1" y="1" width="62" height="62" fill="none" stroke="#B0442A" stroke-opacity="0.4"
                stroke-width="2" />
            <text x="32" y="29" fill="#B0442A"
                font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34"
                font-weight="600" letter-spacing="-1.5" text-anchor="middle" dominant-baseline="central">HS</text>
            <rect x="14" y="49" width="36" height="3" fill="#B0442A" fill-opacity="0.5" />
        </svg>
    </template>

    <script>
        const art = document.getElementById('art');
        for (const id of ['s32', 's180', 's192']) {
            const svg = art.content.firstElementChild.cloneNode(true);
            svg.id = id;
            document.body.appendChild(svg);
        }
        document.fonts.ready.then(() => document.documentElement.setAttribute('data-ready', '1'));
    </script>
</body>

</html>
